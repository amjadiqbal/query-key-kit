<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0F172A"/>
      <stop offset="1" stop-color="#0B1220"/>
    </linearGradient>
    <linearGradient id="acc" gradientUnits="userSpaceOnUse" x1="96" y1="160" x2="430" y2="400">
      <stop offset="0" stop-color="#6EE7B7"/>
      <stop offset="1" stop-color="#10B981"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
  <g transform="translate(-9 -22)">
  <!-- key bow = root scope -->
  <circle cx="160" cy="226" r="66" fill="none" stroke="url(#acc)" stroke-width="34"/>
  <circle cx="160" cy="226" r="14" fill="#6EE7B7"/>
  <!-- shaft = key path -->
  <path d="M226 226 H404" stroke="url(#acc)" stroke-width="34" stroke-linecap="round"/>
  <!-- teeth = nested key branches -->
  <path d="M300 226 V318" stroke="#94A3B8" stroke-width="18" stroke-linecap="round"/>
  <path d="M388 226 V346" stroke="url(#acc)" stroke-width="18" stroke-linecap="round"/>
  <rect x="270" y="310" width="60" height="44" rx="12" fill="#1E293B" stroke="#94A3B8" stroke-width="10"/>
  <rect x="358" y="338" width="60" height="44" rx="12" fill="#10B981" stroke="#6EE7B7" stroke-width="10"/>
  <!-- invalidation ripple on the active leaf -->
  <rect x="340" y="320" width="96" height="80" rx="22" fill="none" stroke="#6EE7B7" stroke-width="5" stroke-dasharray="10 9"/>
  </g>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300">
    <defs>
    <linearGradient id="ibg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0F172A"/>
      <stop offset="1" stop-color="#0B1220"/>
    </linearGradient>
    <linearGradient id="acc" gradientUnits="userSpaceOnUse" x1="96" y1="160" x2="430" y2="400">
      <stop offset="0" stop-color="#6EE7B7"/>
      <stop offset="1" stop-color="#10B981"/>
    </linearGradient>
  </defs>
  <defs><pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1.5" fill="#1A2540"/></pattern></defs>
  <rect width="1200" height="300" fill="#0B1220"/>
  <rect x="800" width="400" height="300" fill="url(#dots)"/>
  <g transform="translate(56 50) scale(0.390625)">
    <rect x="3" y="3" width="506" height="506" rx="110" fill="url(#ibg)" stroke="#24314D" stroke-width="6"/>
  <g transform="translate(-9 -22)">
  <!-- key bow = root scope -->
  <circle cx="160" cy="226" r="66" fill="none" stroke="url(#acc)" stroke-width="34"/>
  <circle cx="160" cy="226" r="14" fill="#6EE7B7"/>
  <!-- shaft = key path -->
  <path d="M226 226 H404" stroke="url(#acc)" stroke-width="34" stroke-linecap="round"/>
  <!-- teeth = nested key branches -->
  <path d="M300 226 V318" stroke="#94A3B8" stroke-width="18" stroke-linecap="round"/>
  <path d="M388 226 V346" stroke="url(#acc)" stroke-width="18" stroke-linecap="round"/>
  <rect x="270" y="310" width="60" height="44" rx="12" fill="#1E293B" stroke="#94A3B8" stroke-width="10"/>
  <rect x="358" y="338" width="60" height="44" rx="12" fill="#10B981" stroke="#6EE7B7" stroke-width="10"/>
  <!-- invalidation ripple on the active leaf -->
  <rect x="340" y="320" width="96" height="80" rx="22" fill="none" stroke="#6EE7B7" stroke-width="5" stroke-dasharray="10 9"/>
  </g>
  </g>
  <text x="290" y="128" font-family="Inter, -apple-system, 'SF Pro Display', 'Helvetica Neue', Arial, sans-serif" font-size="64" font-weight="800" fill="#F8FAFC" letter-spacing="-1.5">query-key-kit</text>
  <text x="292" y="176" font-family="Inter, -apple-system, 'SF Pro Display', 'Helvetica Neue', Arial, sans-serif" font-size="25" font-weight="500" fill="#CBD5E1">Typed query keys + invalidation helpers on top of <tspan font-family="'JetBrains Mono', 'SF Mono', Menlo, Consolas, monospace" fill="#34D399" font-weight="600">queryOptions()</tspan></text>
  <g font-family="Inter, -apple-system, 'SF Pro Display', 'Helvetica Neue', Arial, sans-serif" font-size="17" font-weight="600">
    <rect x="292" y="204" width="214" height="36" rx="18" fill="#111C33" stroke="#1E2A44"/><text x="399" y="228" text-anchor="middle" fill="#34D399">for TanStack Query v5</text>
    <rect x="518" y="204" width="196" height="36" rx="18" fill="#111C33" stroke="#1E2A44"/><text x="616" y="228" text-anchor="middle" fill="#CBD5E1">framework-agnostic</text>
    <rect x="726" y="204" width="300" height="36" rx="18" fill="#111C33" stroke="#1E2A44"/><text x="876" y="228" text-anchor="middle" fill="#CBD5E1">query-key-factory compatible</text>
  </g>
</svg>

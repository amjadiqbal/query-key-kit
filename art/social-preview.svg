<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640">
    <defs>
    <linearGradient id="ibg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0F172A"/>
      <stop offset="1" stop-color="#0B1220"/>
    </linearGradient>
    <linearGradient id="acc" gradientUnits="userSpaceOnUse" x1="96" y1="160" x2="430" y2="400">
      <stop offset="0" stop-color="#6EE7B7"/>
      <stop offset="1" stop-color="#10B981"/>
    </linearGradient>
  </defs>
  <defs><pattern id="dots" width="28" height="28" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1.6" fill="#1A2540"/></pattern></defs>
  <rect width="1280" height="640" fill="#0B1220"/>
  <rect width="1280" height="640" fill="url(#dots)"/>
  <g transform="translate(80 64) scale(0.3125)">
    <rect x="3" y="3" width="506" height="506" rx="110" fill="url(#ibg)" stroke="#24314D" stroke-width="6"/>
  <g transform="translate(-9 -22)">
  <!-- key bow = root scope -->
  <circle cx="160" cy="226" r="66" fill="none" stroke="url(#acc)" stroke-width="34"/>
  <circle cx="160" cy="226" r="14" fill="#6EE7B7"/>
  <!-- shaft = key path -->
  <path d="M226 226 H404" stroke="url(#acc)" stroke-width="34" stroke-linecap="round"/>
  <!-- teeth = nested key branches -->
  <path d="M300 226 V318" stroke="#94A3B8" stroke-width="18" stroke-linecap="round"/>
  <path d="M388 226 V346" stroke="url(#acc)" stroke-width="18" stroke-linecap="round"/>
  <rect x="270" y="310" width="60" height="44" rx="12" fill="#1E293B" stroke="#94A3B8" stroke-width="10"/>
  <rect x="358" y="338" width="60" height="44" rx="12" fill="#10B981" stroke="#6EE7B7" stroke-width="10"/>
  <!-- invalidation ripple on the active leaf -->
  <rect x="340" y="320" width="96" height="80" rx="22" fill="none" stroke="#6EE7B7" stroke-width="5" stroke-dasharray="10 9"/>
  </g>
  </g>
  <text x="270" y="136" font-family="Inter, -apple-system, 'SF Pro Display', 'Helvetica Neue', Arial, sans-serif" font-size="72" font-weight="800" fill="#F8FAFC" letter-spacing="-2">query-key-kit</text>
  <text x="272" y="188" font-family="Inter, -apple-system, 'SF Pro Display', 'Helvetica Neue', Arial, sans-serif" font-size="28" font-weight="500" fill="#CBD5E1">Typed query keys + invalidation helpers on top of <tspan font-family="'JetBrains Mono', 'SF Mono', Menlo, Consolas, monospace" fill="#34D399" font-weight="600">queryOptions()</tspan></text>
  <rect x="80" y="252" width="1120" height="290" rx="20" fill="#0F172A" stroke="#1E2A44" stroke-width="2"/>
  <circle cx="112" cy="282" r="7" fill="#334155"/><circle cx="136" cy="282" r="7" fill="#334155"/><circle cx="160" cy="282" r="7" fill="#334155"/>
  <g font-family="'JetBrains Mono', 'SF Mono', Menlo, Consolas, monospace" font-size="21" fill="#E2E8F0" xml:space="preserve">
    <text x="112" y="330"><tspan fill="#C4B5FD">export const</tspan> todos = <tspan fill="#34D399">createQueryKeys</tspan>(<tspan fill="#7DD3FC">'todos'</tspan>, {</text>
    <text x="137" y="362">detail: (id: <tspan fill="#C4B5FD">number</tspan>) =&gt; ({ queryKey: [id], queryFn: () =&gt; getTodo(id) }),</text>
    <text x="137" y="394">list: (filters: <tspan fill="#C4B5FD">Filters</tspan>) =&gt; ({ queryKey: [{ filters }] }),</text>
    <text x="112" y="426">})</text>
    <text x="112" y="474"><tspan fill="#34D399">useQuery</tspan>(todos.detail(42)) <tspan dx="12" fill="#64748B">// queryKey: ['todos', 'detail', 42]</tspan></text>
    <text x="112" y="506">queryClient.<tspan fill="#34D399">invalidateQueries</tspan>({ queryKey: todos.list._def })</text>
  </g>
  <g font-family="Inter, -apple-system, 'SF Pro Display', 'Helvetica Neue', Arial, sans-serif" font-size="20" font-weight="600">
    <text x="80" y="596" fill="#34D399">npm i @amjadiqbal/query-key-kit</text>
    <text x="1200" y="596" text-anchor="end" fill="#94A3B8">for TanStack Query v5 · framework-agnostic</text>
  </g>
</svg>
